<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin login | Somafish</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head>
<body class="admin-login-body"><main class="login-card"><a class="brand" href="/">Somafish</a><p class="eyebrow">PRIVATE STAFF AREA</p><h1>Welcome back</h1><p class="muted">Sign in to manage orders, products and customer messages.</p><form id="login-form" novalidate><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">Password</label><input id="password" name="password" autocomplete="current-password" type="password" required><p id="login-error" class="error-message" role="alert" hidden></p><button class="primary-btn" type="submit">Sign in</button></form><a class="back-link" href="/">Back to Somafish</a></main></body></html>
